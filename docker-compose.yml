volumes:
  db_data_prod:

services:

  db:
    image: postgres:17
    container_name: hexapi-db-prod
    restart: always
    environment:
      POSTGRES_DB: ${BDD_NAME}
      POSTGRES_USER: ${BDD_USER}
      POSTGRES_PASSWORD: ${BDD_PASSWORD}
    volumes:
      - db_data_preprod:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  back:
    image: ghcr.io/likes-it/api:prod
    container_name: hexapi-app-prod
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY}
      DATABASE_URL: ${DATABASE_URL}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL}
      MINIO_BUCKET: ${MINIO_BUCKET}
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  frontend:
    image: ghcr.io/likes-it-front:prod
    container_name: like-it-front-prod
    restart: unless-stopped
    ports:
      - "3000:3000"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
  
  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    restart: always
    command:
      - --interval
      - "${WATCHTOWER_INTERVAL:-300}"
      - --label-enable
      - --cleanup
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock