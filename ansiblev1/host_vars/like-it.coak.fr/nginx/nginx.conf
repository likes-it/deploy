
# 1) Proxy TCP pour PostgreSQL (stream)
stream {
    upstream pgsql {
        server 127.0.0.1:5432;
    }

    server {
        listen 5432 ssl;                      # on expose 5432 en TLS
        proxy_pass pgsql;                     # on forwarde vers Postgres local

        # Certificat pour like-it-bdd.coak.fr
        ssl_certificate     /etc/letsencrypt/live/like-it-bdd.coak.fr/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/like-it-bdd.coak.fr/privkey.pem;

        # TLS settings (on peut affiner selon tes besoins)
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
    }
}

http {
    # 2) Catch-all HTTP → HTTPS
    server {
        listen 80;
        server_name like-it.coak.fr
                    like-it-api.coak.fr
                    like-it-bdd.coak.fr;
        return 301 https://$host$request_uri;
    }

    # 3) Frontend
    server {
        listen 443 ssl;
        server_name like-it.coak.fr;

        ssl_certificate     /etc/letsencrypt/live/like-it.coak.fr/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/like-it.coak.fr/privkey.pem;
        include             /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

        location / {
            proxy_pass         http://127.0.0.1:3000;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }

    # 4) Backend API
    server {
        listen 443 ssl;
        server_name like-it-api.coak.fr;

        ssl_certificate     /etc/letsencrypt/live/like-it-api.coak.fr/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/like-it-api.coak.fr/privkey.pem;
        include             /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

        location / {
            proxy_pass         http://127.0.0.1:8000;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }
}
